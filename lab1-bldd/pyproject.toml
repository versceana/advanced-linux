[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bldd"
version = "0.1.0"
description = "Backward ldd: find executables that depend on given shared libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyelftools",
  "typer",
  "rich",
  "reportlab",
]

[project.scripts]
bldd = "bldd.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bldd*"]
